name: Build and Deploy Code   #the name can be anything you want

on: [push, pull_request]      #this will trigger the workflow on push and pull request events

jobs:                         #this is where you define the jobs that will run in the workflow
  job1:
    runs-on: ubuntu-latest    #this specifies the operating system that the job will run on
    steps:
      - name: pulling git repo  #this is the name of the step, you can name it anything you want
        uses: actions/checkout@v4 #this is the action that will pull the code from the git repository, you can specify the version of the action you want to use
      - name: Install python  #this is another step, you can add as many steps as you want
        uses: actions/setup-python@v6  #this is the action that will set up python on the runner, you can specify the version of python you
        with:
          python-version: "3.12" #this specifies the version of python you want to use, you can change it to any version you want
      - name: upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt  #this will install the dependencies specified in the requirements.txt file, you can change it to any command you want to run
      - name: Run tests with pytest #this will install pytest and run the tests, you can change it to any command you want to run
        run: |
          pip install pytest
          pytest 